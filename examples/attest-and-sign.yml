#
# The attestation is the claim a gateway or registry verifies offline:
# the verdict of every check, the score, and what it was judged against.
# scout writes it; this workflow signs it with the workflow's own identity
# through GitHub artifact attestations, so a consumer can check who ran the
# diagnostic with `gh attestation verify`. The verifier for the statement
# itself is github.com/sebastienrousseau/scout-reporting.
name: Attest the MCP server

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: sebastienrousseau/scout-action@v0.0.4
        id: scout
        with:
          endpoint: https://mcp.example.com/mcp
          token: ${{ secrets.MCP_TOKEN }}
          attest: "true"
          fail-on: never

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.scout.outputs.attestation }}
          predicate-type: https://scoutmcp.io/attestation/mcp-evaluation/v1
          predicate-path: ${{ steps.scout.outputs.attestation }}
