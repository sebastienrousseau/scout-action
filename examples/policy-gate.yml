#
# Gate a deployment on an acceptance policy committed in the repository.
# The policy names the checks that must pass, caps failures and warnings,
# and can carry exemptions with a reason, a ticket and an expiry date —
# which is the difference between a gate a team keeps and one it switches
# off. See scout's manual, "Acceptance policies".
name: Gate the MCP server

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sebastienrousseau/scout-action@v0.0.7
        id: scout
        with:
          endpoint: https://staging.mcp.example.com/mcp
          token: ${{ secrets.STAGING_MCP_TOKEN }}
          policy: .scout/policy.json
          fail-on: failure

      # The outputs are there even when the step failed the job, for a
      # notification step with `if: always()`.
      - name: Say what happened
        if: always()
        env:
          SCORE: ${{ steps.scout.outputs.score }}
          GRADE: ${{ steps.scout.outputs.grade }}
          CODE: ${{ steps.scout.outputs.exit-code }}
        run: echo "scout scored ${SCORE} (${GRADE}), exit ${CODE}"
